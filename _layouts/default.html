<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body id="top" class="min-h-screen bg-white text-stone-900">
    <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <header class="mb-8 border-b border-stone-200 pb-6">
        <div class="mt-2 flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
          <div class="min-w-0">
            <h1 class="text-3xl font-semibold tracking-tight text-stone-950 sm:text-4xl">{{ site.title }}</h1>
            <p class="mt-3 max-w-3xl text-base leading-7 text-stone-600">{{ site.description }}</p>
          </div>

          <div class="flex items-center gap-3 lg:mt-1 lg:flex-shrink-0">
            <input
              id="perk-search"
              type="search"
              placeholder="Search perks"
              class="search-input w-full max-w-xs rounded-full border px-4 py-2.5 text-sm outline-none transition"
            >
            <a href="https://github.com/sdhutchins/awesome-edu-perks" target="_blank" rel="noopener noreferrer" class="text-stone-400 transition hover:text-stone-700" aria-label="View on GitHub">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            </a>
          </div>
        </div>
      </header>

      <div class="site-shell lg:grid lg:grid-cols-[15rem_minmax(0,1fr)] lg:gap-12">
        <aside id="section-nav" class="hidden lg:block">
          <div class="lg:sticky lg:top-8">
            <p class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-stone-500">Browse</p>
            <nav id="section-nav-content" class="section-nav"></nav>
          </div>
        </aside>

        <main class="markdown-body min-w-0">
          {{ content }}
        </main>
      </div>
    </div>

    <a
      href="#top"
      class="back-to-top fixed bottom-5 right-5 inline-flex items-center rounded-full border px-4 py-2 text-sm font-medium shadow-sm transition hover:-translate-y-0.5"
      aria-label="Back to top"
    >
      Top
    </a>

    <script>
      (function () {
        const contentRoot = document.querySelector(".markdown-body");
        const navRoot = document.getElementById("section-nav-content");
        if (!contentRoot || !navRoot) return;

        const headings = Array.from(contentRoot.querySelectorAll("h2"));
        const categoriesHeading = headings.find((heading) => heading.textContent.trim() === "Categories");
        if (!categoriesHeading) return;

        const categoriesList = categoriesHeading.nextElementSibling;
        if (!categoriesList || categoriesList.tagName !== "UL") return;

        const navList = categoriesList.cloneNode(true);
        navRoot.appendChild(navList);
        categoriesHeading.classList.add("categories-source");
        categoriesList.classList.add("categories-source");
      })();

      (function () {
        const contentRoot = document.querySelector(".markdown-body");
        const searchInput = document.getElementById("perk-search");
        if (!contentRoot || !searchInput) return;

        const sectionHeadings = Array.from(contentRoot.querySelectorAll("h2"));
        const searchableSections = sectionHeadings
          .filter((heading) => heading.textContent.trim() !== "Categories" && heading.textContent.trim() !== "Discount Aggregators" && heading.textContent.trim() !== "References & Source Articles")
          .map((heading) => {
            const entries = [];
            let node = heading.nextElementSibling;

            while (node && node.tagName !== "H2") {
              if (node.tagName === "H3") {
                const entryNodes = [node];
                let sibling = node.nextElementSibling;
                while (sibling && sibling.tagName !== "H3" && sibling.tagName !== "H2") {
                  entryNodes.push(sibling);
                  sibling = sibling.nextElementSibling;
                }

                entries.push({
                  heading: node,
                  nodes: entryNodes,
                  text: entryNodes.map((entryNode) => entryNode.textContent.toLowerCase()).join(" ") + " " + heading.textContent.toLowerCase(),
                });
              }
              node = node.nextElementSibling;
            }

            return { heading, entries };
          });

        searchInput.addEventListener("input", () => {
          const query = searchInput.value.trim().toLowerCase();

          searchableSections.forEach((section) => {
            let visibleEntries = 0;

            section.entries.forEach((entry) => {
              const matches = query === "" || entry.text.includes(query);
              entry.nodes.forEach((node) => {
                node.style.display = matches ? "" : "none";
              });
              if (matches) visibleEntries += 1;
            });

            section.heading.style.display = visibleEntries > 0 || query === "" ? "" : "none";
          });
        });
      })();
    </script>
  </body>
</html>
